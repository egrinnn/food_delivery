{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="account-tabs">
        <a href="{% url 'profile' %}" class="btn btn-outline-primary"><i class="bi bi-person-fill me-2"></i>Профиль</a>
        <a href="{% url 'favorites' %}" class="btn btn-primary"><i class="bi bi-heart-fill me-2"></i>Избранное</a>
        <a href="{% url 'order_history' %}" class="btn btn-outline-primary"><i class="bi bi-clock-history-fill me-2"></i>История заказов</a>
    </div>

    {% if favorites %}
    <div class="row g-4">
        {% for f in favorites %}
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="card h-100">
                <img src="{{ f.product.image_url|default:'https://via.placeholder.com/400x300/5d7a5d/ffffff?text='|add:f.product.name }}" class="card-img-top" alt="{{ f.product.name }}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ f.product.name }}</h5>
                    <p class="card-text text-primary fw-bold fs-5 mb-3">{{ f.product.price }} ₽</p>
                    <button class="btn btn-primary w-100 btn-lg add-to-cart mt-auto" data-id="{{ f.product.id }}">
                        <i class="bi bi-cart-plus me-2"></i>В корзину
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="text-center py-5">
        <i class="bi bi-heart display-1 text-muted opacity-50"></i>
        <h3 class="mt-3 text-muted">Список избранного пуст</h3>
        <a href="{% url 'catalog' %}" class="btn btn-outline-primary btn-lg mt-3">Перейти в меню</a>
    </div>
    {% endif %}
</div>
{% endblock %}
