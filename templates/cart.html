{% extends 'base.html' %}
{% block title %}Корзина | FoodDelivery{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-basket me-2"></i>Ваша корзина</h2>
    
    <div id="cart-container">
        <p class="text-muted text-center py-4">Загрузка...</p>
    </div>
</div>

<!-- Скрипт корзины -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('cart-container');
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // === ПУСТАЯ КОРЗИНА ===
    if (cart.length === 0) {
        container.innerHTML = `
            <div class="card text-center py-5">
                <div class="card-body">
                    <i class="bi bi-basket display-1 text-muted opacity-50 mb-3"></i>
                    <h4 class="text-muted mb-3">Ваша корзина пуста</h4>
                    <p class="text-muted mb-4">Добавьте блюда из меню, чтобы оформить заказ</p>
                    <a href="{% url 'catalog' %}" class="btn btn-primary btn-lg">
                        <i class="bi bi-grid me-2"></i>Перейти в меню
                    </a>
                </div>
            </div>`;
        return;
    }

    // === РЕНДЕР КОРЗИНЫ ===
    let total = 0;
    let rows = '';
    
    cart.forEach((item, index) => {
        const lineSum = parseFloat(item.price) * item.qty;
        total += lineSum;
        
        rows += `
            <tr>
                <td class="ps-4">
                    <div class="d-flex align-items-center gap-3">
                        <img src="${item.image || 'https://via.placeholder.com/60x60/5d7a5d/ffffff?text=🍽️'}" 
             class="rounded" 
             style="width:60px;height:60px;object-fit:cover" 
             alt="${item.name}"
             onerror="this.src='https://via.placeholder.com/60x60/5d7a5d/ffffff?text=🍽️'">
        <span class="fw-medium">${item.name}</span>
    </div>
</td>
                <td><span class="text-primary fw-bold">${parseFloat(item.price).toFixed(0)} ₽</span></td>
                <td>
                    <div class="qty-control d-flex align-items-center gap-2">
                        <button class="btn btn-sm btn-outline-secondary qty-btn" 
                                data-idx="${index}" data-act="dec">−</button>
                        <span class="fw-medium" style="min-width:24px;text-align:center">${item.qty}</span>
                        <button class="btn btn-sm btn-outline-primary qty-btn" 
                                data-idx="${index}" data-act="inc">+</button>
                    </div>
                </td>
                <td class="fw-bold">${lineSum.toFixed(0)} ₽</td>
                <td>
                    <button class="btn btn-link text-danger p-0 remove-btn" 
                            data-idx="${index}" title="Удалить">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>`;
    });

    container.innerHTML = `
        <div class="row">
            <!-- Таблица товаров -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4">Товар</th>
                                        <th>Цена</th>
                                        <th>Кол-во</th>
                                        <th>Сумма</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Итого и кнопка оформления -->
            <div class="col-lg-4">
                <div class="card sticky-top" style="top: 100px;">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Итого</h5>
                        
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Товары:</span>
                            <span>${total.toFixed(0)} ₽</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Доставка:</span>
                            <span class="text-success">Бесплатно</span>
                        </div>
                        
                        <hr>
                        
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 fw-bold">К оплате:</span>
                            <span class="fs-4 fw-bold text-primary">${total.toFixed(0)} ₽</span>
                        </div>
                        
                        <!-- КНОПКА ОФОРМИТЬ ЗАКАЗ -->
                        <a href="{% url 'checkout' %}" class="btn btn-accent btn-lg w-100">
                            <i class="bi bi-check-circle me-2"></i>Оформить заказ
                        </a>
                        
                        <p class="text-muted small text-center mt-3 mb-0">
                            <i class="bi bi-shield-check me-1"></i>Безопасный заказ
                        </p>
                    </div>
                </div>
            </div>
        </div>`;

    // === ОБРАБОТЧИКИ КНОПОК ===
    document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const idx = parseInt(e.currentTarget.dataset.idx);
            const act = e.currentTarget.dataset.act;
            
            if (act === 'inc') cart[idx].qty++;
            else if (act === 'dec' && cart[idx].qty > 1) cart[idx].qty--;
            else return;
            
            saveAndReload();
        });
    });
    
    document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const idx = parseInt(e.currentTarget.dataset.idx);
            cart.splice(idx, 1);
            saveAndReload();
        });
    });
    
    function saveAndReload() {
        localStorage.setItem('cart', JSON.stringify(cart));
        // Обновляем счётчик в шапке
        const count = document.getElementById('cart-count');
        if (count) count.textContent = cart.reduce((sum, i) => sum + i.qty, 0);
        location.reload();
    }
});
</script>
{% endblock %}
