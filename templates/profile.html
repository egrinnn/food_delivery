{% extends 'base.html' %}
{% block content %}
<div class="container">
    <!-- Вкладки -->
    <div class="account-tabs">
        <a href="{% url 'profile' %}" class="btn {% if request.resolver_match.url_name == 'profile' %}btn-primary{% else %}btn-outline-primary{% endif %}">
            <i class="bi bi-person-fill me-2"></i>Профиль
        </a>
        <a href="{% url 'favorites' %}" class="btn {% if request.resolver_match.url_name == 'favorites' %}btn-primary{% else %}btn-outline-primary{% endif %}">
            <i class="bi bi-heart-fill me-2"></i>Избранное
        </a>
        <a href="{% url 'order_history' %}" class="btn {% if request.resolver_match.url_name == 'order_history' %}btn-primary{% else %}btn-outline-primary{% endif %}">
            <i class="bi bi-clock-history-fill me-2"></i>История заказов
        </a>
    </div>

    <!-- Форма профиля -->
    <div class="profile-card">
        <h3 class="mb-4"><i class="bi bi-pencil-square me-2"></i>Личные данные</h3>
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-12 col-md-6">
                <label class="form-label text-muted small text-uppercase">Логин</label>
                <input type="text" class="form-control form-control-lg bg-light" value="{{ user.username }}" readonly>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label text-muted small text-uppercase">Имя</label>
                <input type="text" name="first_name" class="form-control form-control-lg" value="{{ user.first_name }}" placeholder="Ваше имя">
            </div>
            <div class="col-12">
                <label class="form-label text-muted small text-uppercase">Email</label>
                <input type="email" name="email" class="form-control form-control-lg" value="{{ user.email }}" placeholder="name@example.com">
            </div>
            <div class="col-12 mt-4 d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary btn-lg px-4 py-2">
                    <i class="bi bi-check-lg me-2"></i>Сохранить
                </button>
                <a href="#" class="btn btn-outline-secondary btn-lg px-4 py-2">
                    <i class="bi bi-key me-2"></i>Сменить пароль
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
